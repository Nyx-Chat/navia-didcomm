name: Semantic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-edit
        run: cargo install cargo-edit
      
      - name: Install semantic-release and plugins
        run: |
          npm install -g \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/exec \
            conventional-changelog-conventionalcommits
      
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      
      - name: Get latest version
        id: get_version
        run: |
          VERSION=$(grep -E '^version = ' Cargo.toml | head -1 | sed -E "s/^version = ['\"](.+)['\"]$/\1/")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Released version: $VERSION"
      
      - name: Trigger package publishing
        if: steps.get_version.outputs.VERSION != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: publish-package
          client-payload: '{"version": "${{ steps.get_version.outputs.VERSION }}"}'

  publish-on-release:
    name: Build and Upload Release Package
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'publish-package'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build and test
        run: |
          cargo build --release --all-features
          cargo test --all-features
      
      - name: Package the crate
        run: cargo package --allow-dirty
      
      - name: Get package info
        id: package_info
        run: |
          PACKAGE_NAME=$(grep -E '^name = ' Cargo.toml | head -1 | sed -E "s/^name = ['\"](.+)['\"]$/\1/")
          VERSION="${{ github.event.client_payload.version }}"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "CRATE_FILE=${PACKAGE_NAME}-${VERSION}.crate" >> $GITHUB_OUTPUT
      
      - name: Upload crate to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package_info.outputs.VERSION }}
          files: target/package/${{ steps.package_info.outputs.CRATE_FILE }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create cargo package artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargo-package-${{ github.event.client_payload.version }}
          path: target/package/*.crate
          retention-days: 30