name: PR Preview Package

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  publish-preview:
    name: Publish PR Preview Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Generate preview version
        id: preview_version
        run: |
          # Get current version from Cargo.toml (handles both single and double quotes)
          BASE_VERSION=$(grep -E '^version = ' Cargo.toml | head -1 | sed -E "s/^version = ['\"](.+)['\"]$/\1/")
          
          # Create preview version with PR number and commit SHA
          PREVIEW_VERSION="${BASE_VERSION}-pr.${{ github.event.pull_request.number }}.$(git rev-parse --short HEAD)"
          
          echo "BASE_VERSION=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "PREVIEW_VERSION=$PREVIEW_VERSION" >> $GITHUB_OUTPUT
          echo "Preview version: $PREVIEW_VERSION"
      
      - name: Update version for preview
        run: |
          # Update only the first version line (the package version, not dependencies)
          # This avoids cargo set-version's semver validation which treats pre-release as downgrade
          sed -i "0,/^version = .*/{s/^version = .*/version = \"${{ steps.preview_version.outputs.PREVIEW_VERSION }}\"/}" Cargo.toml
          
          # Show the updated version
          grep -E '^version = ' Cargo.toml | head -1
      
      - name: Build and test
        run: |
          cargo build --release --all-features
          cargo test --all-features
      
      - name: Configure cargo for GitHub Package Registry
        run: |
          # GitHub Packages for Rust requires authentication via .cargo/config.toml
          mkdir -p ~/.cargo
          
          # Note: GitHub doesn't support a full Cargo registry yet, but we can configure authentication
          cat > ~/.cargo/config.toml << EOF
          [registries.github]
          index = "https://github.com/${{ github.repository }}"
          
          [net]
          git-fetch-with-cli = true
          EOF
          
          # Set up git credentials for cargo
          git config --global credential.helper store
          echo "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com" > ~/.git-credentials
      
      - name: Package and publish the crate
        id: package
        env:
          CARGO_REGISTRIES_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Package the crate with the preview version
          cargo package --allow-dirty
          
          # Get package name for later use
          PACKAGE_NAME=$(grep -E '^name = ' Cargo.toml | head -1 | sed -E "s/^name = ['\"](.+)['\"]$/\1/")
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          
          # Since GitHub doesn't have a proper Cargo registry, we'll create a git tag for this preview
          git tag "preview-pr-${{ github.event.pull_request.number }}-$(git rev-parse --short HEAD)" || true
          
          # List the generated .crate file
          ls -la target/package/*.crate
      
      - name: Upload preview package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-package-${{ github.event.pull_request.number }}
          path: target/package/*.crate
          retention-days: 3  # Reduced to 3 days for faster cleanup
      
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const package_name = '${{ steps.package.outputs.package_name }}';
            const preview_version = '${{ steps.preview_version.outputs.PREVIEW_VERSION }}';
            const base_version = '${{ steps.preview_version.outputs.BASE_VERSION }}';
            const pr_number = context.payload.pull_request.number;
            
            const comment = `## 📦 Preview Package Built
            
            A preview package has been built for this PR:
            
            **Package:** \`${package_name}\`
            **Version:** \`${preview_version}\`
            **Base version:** \`${base_version}\`
            
            ### Usage via git dependency:
            
            \`\`\`toml
            [dependencies]
            ${package_name} = { git = "https://github.com/${{ github.repository }}.git", rev = "${{ github.event.pull_request.head.sha }}" }
            \`\`\`
            
            Or using the PR branch:
            
            \`\`\`toml
            [dependencies]
            ${package_name} = { git = "https://github.com/${{ github.repository }}.git", branch = "${{ github.event.pull_request.head.ref }}" }
            \`\`\`
            
            ### Download .crate file:
            
            The packaged \`.crate\` file is available as a [workflow artifact](https://github.com/${{ github.repository }}/actions/runs/${context.runId}) for 3 days.
            
            ### Notes:
            - This is a preview build for testing purposes
            - When merged, semantic versioning will determine the final release version`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              (comment.body.includes('Preview Package Built') || comment.body.includes('Preview Package Published'))
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr_number,
                body: comment
              });
            }