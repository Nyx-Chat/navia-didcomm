[package]
name = 'navia-didcomm'
version = '1.0.0'
authors = ['Nyx Team <dev@nyx.chat>', 'Vyacheslav Gudkov <vyacheslav.gudkov@dsr-corporation.com>']
edition = '2021'
rust-version = '1.70'
description = 'Production-ready DIDComm v2 implementation for secure peer-to-peer messaging'
license = 'Apache-2.0'
repository = 'https://github.com/Nyx-Chat/navia-didcomm'
homepage = 'https://github.com/Nyx-Chat/navia-didcomm'
documentation = 'https://docs.rs/navia-didcomm'
readme = 'README.md'
keywords = ['didcomm', 'messaging', 'cryptography', 'decentralized', 'privacy']
categories = ['cryptography', 'network-programming', 'authentication']
exclude = []

[dependencies]
anyhow = '1.0'
base64 = '0.22'
async-trait = '0.1'
thiserror = '1.0'
serde_json = '1.0'
serde-enum-str = '0.1'
sha2 = '0.10'
curve25519-dalek = '4.1.3'
ed25519-dalek = '2.2.0'
bs58 = "0.4.0"
varint = "0.9.0"
subtle = "2.5"
lazy_static = { version = "1.4.0", optional = true }
tracing = { version = "0.1", optional = true }

[dependencies.serde]
version = '1.0'
features = ['derive']

[dependencies.askar-crypto]
version = '0.3.6'
features = ['std', 'k256', 'p384']

[dependencies.uuid]
version = "1.11"
features = ["v4"]

[dev-dependencies]
lazy_static = '1.4.0'
futures = '0.3'

[dev-dependencies.tokio]
version = '1.9'
features = [
    'rt',
    'macros',
]

[dev-dependencies.getrandom]
version = '0.2'

[dev-dependencies.criterion]
version = '0.3'
features = ['async_futures']

[dev-dependencies.rusty-hook]
version = "0.11.2"

[features]
uniffi = []
testvectors = ["lazy_static"]
tracing = ["dep:tracing"]

[lints.clippy]
# Allow common patterns in cryptographic libraries
upper_case_acronyms = "allow"
module_inception = "allow"
too_many_arguments = "allow"
extra_unused_lifetimes = "allow"
doc_lazy_continuation = "allow"
