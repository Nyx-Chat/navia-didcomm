[package]
name = 'navia-didcomm'
version = "1.1.1"
authors = ['Nyx Team <dev@nyx.chat>', 'Vyacheslav Gudkov <vyacheslav.gudkov@dsr-corporation.com>']
edition = '2021'
rust-version = '1.70'
description = 'Production-ready DIDComm v2 implementation for secure peer-to-peer messaging'
license = 'Apache-2.0'
repository = 'https://github.com/Nyx-Chat/navia-didcomm'
homepage = 'https://github.com/Nyx-Chat/navia-didcomm'
documentation = 'https://docs.rs/navia-didcomm'
publish = ["github"]
readme = 'README.md'
keywords = ['didcomm', 'messaging', 'cryptography', 'decentralized', 'privacy']
categories = ['cryptography', 'network-programming', 'authentication']
exclude = []

[dependencies]
# Core dependencies
anyhow = "1.0"
async-trait = "0.1"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-enum-str = "0.4"

# Cryptography
askar-crypto = { version = "0.3.6", features = ["std", "k256", "p384"] }
sha2 = "0.10"
subtle = "2.6"

# Encoding
base64 = "0.22"
bs58 = "0.5.1"
varint = "0.9.0"

# Utilities
uuid = { version = "1.18", features = ["v4"] }

# Optional dependencies
lazy_static = { version = "1.5", optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
lazy_static = '1.5'
tracing-test = '0.2'

[dev-dependencies.tokio]
version = '1'
features = [
    'rt',
    'macros',
]

[dev-dependencies.criterion]
version = '0.7'
features = ['async_futures']

[features]
uniffi = []
testvectors = ["lazy_static"]
tracing = ["dep:tracing"]

[lints.clippy]
# Allow common patterns in cryptographic libraries
upper_case_acronyms = "allow"
module_inception = "allow"
too_many_arguments = "allow"
extra_unused_lifetimes = "allow"
doc_lazy_continuation = "allow"
