[package]
name = 'navia-didcomm'
version = '1.0.3'
authors = ['Nyx Team <dev@nyx.chat>', 'Vyacheslav Gudkov <vyacheslav.gudkov@dsr-corporation.com>']
edition = '2021'
rust-version = '1.70'
description = 'Production-ready DIDComm v2 implementation for secure peer-to-peer messaging'
license = 'Apache-2.0'
repository = 'https://github.com/Nyx-Chat/navia-didcomm'
homepage = 'https://github.com/Nyx-Chat/navia-didcomm'
documentation = 'https://docs.rs/navia-didcomm'
readme = 'README.md'
keywords = ['didcomm', 'messaging', 'cryptography', 'decentralized', 'privacy']
categories = ['cryptography', 'network-programming', 'authentication']
exclude = []

[dependencies]
anyhow = '1.0'                                  # Used in error.rs for Error.source
base64 = '0.22'                                 # Used in pqc_jws.rs for JWT encoding
async-trait = '0.1.88'                          # Used for async trait implementations
thiserror = '1.0'                               # Used in error.rs for Error derive
serde_json = '1.0'                              # Used throughout for JSON handling
sha2 = '0.10'                                   # Used in pqc_jwe.rs for hashing
bs58 = "0.4.0"                                  # Used in error.rs for base58 error handling
subtle = "2.5"                                  # Used in utils/secure_cmp.rs for constant-time comparisons
tracing = { version = "0.1", optional = true }  # Used in error.rs behind feature flag

# Post-Quantum Cryptography (Now Required)
libcrux-ml-kem = "0.0.3"                       # ML-KEM key encapsulation
pqcrypto-dilithium = "0.5"                     # ML-DSA digital signatures
pqcrypto-traits = "0.3"                        # Common PQC traits
multibase = "0.9"                              # Multibase encoding for DID keys

[dependencies.serde]
version = '1.0'
features = ['derive']

[dependencies.askar-crypto]
version = '0.3.6'
features = ['std', 'k256', 'p384']

[dependencies.uuid]
version = "1.11"
features = ["v4"]

[dev-dependencies]
lazy_static = '1.4.0'
futures = '0.3'
tracing-test = '0.2'

[dev-dependencies.tokio]
version = '1.9'
features = [
    'rt',
    'rt-multi-thread',
    'macros',
]

[dev-dependencies.getrandom]
version = '0.2'

[dev-dependencies.criterion]
version = '0.3'
features = ['async_tokio']

[dev-dependencies.rusty-hook]
version = "0.11.2"

[features]
default = []
uniffi = []
testvectors = []  # Removed lazy_static dependency
tracing = ["dep:tracing"]

[[bench]]
name = "pqc_performance"
harness = false

[[bench]]
name = "pqc_core_operations"
harness = false

[[bench]]
name = "simple_pqc_bench"
harness = false

[[bench]]
name = "pqc_size_bench"
harness = false

[[bench]]
name = "pqc_e2e_bench"
harness = false

[[bench]]
name = "pqc_throughput_bench"
harness = false

[lints.clippy]
# Allow common patterns in cryptographic libraries
upper_case_acronyms = "allow"
module_inception = "allow"
too_many_arguments = "allow"
extra_unused_lifetimes = "allow"
doc_lazy_continuation = "allow"
