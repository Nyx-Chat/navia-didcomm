# Clippy configuration for navia-didcomm
# Following main Navia project patterns

# Warn on all clippy lints by default
warn-on-all-wildcard-imports = true

# Set maximum cognitive complexity
cognitive-complexity-threshold = 20

# Set maximum number of lines for functions
too-many-lines-threshold = 100

# Set maximum number of arguments
too-many-arguments-threshold = 7

# Allow some common patterns in crypto libraries
# JWE/JWS are standard acronyms in cryptography
upper-case-acronyms-aggressive = false

# Allow private module inception for message/message.rs pattern
allow-private-module-inception = true